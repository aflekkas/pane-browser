name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # Pinned so a newer SwiftFormat release (new/changed rules) cannot turn
  # previously-clean code red, or silently demand a tree-wide reformat.
  # Bump deliberately and re-run `swiftformat .` with the new version.
  SWIFTFORMAT_VERSION: "0.63.1"

# The lint and build jobs are deliberately independent (no `needs:`):
# a formatting failure must stay visible as a failed job, but it must
# not block compilation evidence for the same commit.
jobs:
  lint:
    name: Lint and formatting
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint

    - name: Install SwiftFormat (pinned)
      run: |
        curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" \
          -o /tmp/swiftformat.zip
        unzip -o /tmp/swiftformat.zip -d /tmp/swiftformat-bin
        echo "/tmp/swiftformat-bin" >> "$GITHUB_PATH"

    - name: Show SwiftFormat version
      run: swiftformat --version

    - name: Check code formatting
      run: swiftformat --lint .

  build:
    name: Build (Debug, unsigned)
    runs-on: macos-latest

    steps:
    - name: Check architecture
      run: uname -m

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Show Swift version
      run: swift --version

    - name: Install Xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen

    - name: Install Xcbeautify
      run: brew install xcbeautify

    - name: Clean build folder
      run: xcodebuild clean -scheme ora -project Pane.xcodeproj

    - name: Cache SPM dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm/
          ~/.swiftpm/
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve dependencies
      run: xcodebuild -resolvePackageDependencies

    # Pane: actually compile the app (unsigned) so CI catches build breaks.
    - name: Build (Debug, unsigned)
      run: |
        set -o pipefail
        xcodebuild build -project Pane.xcodeproj -scheme ora -configuration Debug \
          -destination "platform=macOS" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          CODE_SIGNING_ALLOWED=NO | xcbeautify

    # Downloadable development app for manual runtime testing without a
    # local Xcode. Ad-hoc signed with the existing local entitlements
    # (sandbox kept; no Developer ID, no provisioning profile, not a
    # release build). ditto preserves the bundle structure.
    - name: Package development app artifact
      run: |
        APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug/Pane.app"
        test -d "$APP"
        codesign --force --sign - --entitlements ora/Info/pane-local.entitlements --deep "$APP"
        codesign --verify --deep --strict "$APP"
        ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Pane-dev.zip"
        ls -lh "$RUNNER_TEMP/Pane-dev.zip"

    - name: Upload development app
      uses: actions/upload-artifact@v4
      with:
        name: Pane-dev-app
        path: ${{ runner.temp }}/Pane-dev.zip
        if-no-files-found: error

  test:
    name: Test (oraTests)
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install Xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen

    - name: Install Xcbeautify
      run: brew install xcbeautify

    # Real test execution (previously CI only built). The scheme's test
    # action already targets oraTests; TEST_HOST is Pane.app, whose Swift
    # module is pinned to `Ora` via PRODUCT_MODULE_NAME in project.yml.
    - name: Run tests
      run: |
        set -o pipefail
        xcodebuild test -project Pane.xcodeproj -scheme ora -configuration Debug \
          -destination "platform=macOS" \
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
          CODE_SIGNING_ALLOWED=NO | xcbeautify

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: ${{ runner.temp }}/TestResults.xcresult
        if-no-files-found: ignore
